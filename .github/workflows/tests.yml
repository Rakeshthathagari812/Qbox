# Runs every test on each push and pull request. No secrets are needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qbox
          POSTGRES_PASSWORD: only-for-this-test-run
          POSTGRES_DB: qbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qbox -d qbox_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QBOX_DATABASE_URL: postgresql+pg8000://qbox:only-for-this-test-run@localhost:5432/qbox_test
    defaults:
      run:
        working-directory: qbox_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: qbox_backend/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest -q
      - name: Known security holes in the libraries
        run: pip install pip-audit && pip-audit -r constraints.txt --no-deps --disable-pip

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qbox_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: qbox_ai/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qbox_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib test
      - run: flutter test
